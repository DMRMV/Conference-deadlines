name: Update Conference Deadlines

on:
  schedule:
    # 8:00 AM Japan time = 11:00 PM UTC on the previous day
    - cron: "0 23 * * *"

  # Lets us test the automation manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-conferences:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai requests beautifulsoup4

      - name: Run conference updater
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python update_conferences.py

      - name: Commit updated conference table
        run: |
          git config user.name "conference-tracker-bot"
          git config user.email "actions@github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No conference changes found."
            exit 0
          fi

          git commit -m "Automatic conference deadline update"
          git push
